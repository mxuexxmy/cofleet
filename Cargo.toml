[package]
name = "cofleet"
version = "0.5.0"
edition = "2024"
rust-version = "1.95"
publish = false
license = "MIT"
description = "Lightweight device agents and a LazyCat-hosted control hub"
repository = "https://github.com/mxuexxmy/cofleet"

[features]
default = []
tray = ["dep:tray-icon", "dep:tao", "dep:open"]

[dependencies]
sha2 = "0.10"
tar = { version = "0.4", default-features = false }
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
futures-util = { version = "0.3", features = ["sink"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
clap = { version = "4", features = ["derive", "env"] }
directories = "6"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
fs2 = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "signal", "process", "fs"] }
toml = "0.9"
uuid = { version = "1", features = ["v4", "serde"] }
tray-icon = { version = "0.21", optional = true, default-features = false }
tao = { version = "0.34", optional = true }
open = { version = "5", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_Memory"] }

[[bin]]
name = "cofleet-manager"
path = "src/bin/manager.rs"

[[bin]]
name = "cofleet-agent"
path = "src/bin/agent.rs"

[[bin]]
name = "cofleetctl"
path = "src/bin/ctl.rs"

[[bin]]
name = "cofleet-tray"
path = "src/bin/tray.rs"
required-features = ["tray"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"
